appId: ${MAESTRO_APP_ID}
---
# if ${MAESTRO_LOGIN_WITH_KEYCLOAK} is set, run the loginWithKeyCloak.yaml flow, otherwise run the loginWithMas.yaml flow
- runFlow:
    when:
      true: ${MAESTRO_LOGIN_WITH_KEYCLOAK != null}
    file: loginWithKeyCloak.yaml
- runFlow:
    when:
      true: ${MAESTRO_LOGIN_WITH_KEYCLOAK == null}
    file: loginWithMas.yaml
