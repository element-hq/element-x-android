appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: "home_screen-settings"
- tapOn: "Remove this device"
# Give the screen the time to work out what the user has to be asked before removing the device
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: build/maestro/900-SignOutScreen
# Ensure pressing back cancels
- back
- tapOn: "Remove this device"
- waitForAnimationToEnd:
    timeout: 3000
# The question depends on the account: another verified device, or only a recovery key, or no recovery at all.
- runFlow:
    when:
      visible: "Are you sure you want to remove this device?"
    commands:
      - tapOn: "Remove"
- runFlow:
    when:
      visible: "Continue to remove this device"
    commands:
      - tapOn: "Continue to remove this device"
- runFlow:
    when:
      visible: "Remove this device anyway"
    commands:
      - tapOn: "Remove this device anyway"
- runFlow: ../assertions/assertInitDisplayed.yaml
