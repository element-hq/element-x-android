# Default rules: https://github.com/detekt/detekt/blob/main/detekt-core/src/main/resources/default-detekt-config.yml

style:
  AlsoCouldBeApply:
    active: true
  BracesOnWhenStatements:
    active: false
  CascadingCallWrapping:
    active: true
    includeElvis: true
  DataClassShouldBeImmutable:
    active: true
  EqualsNullCall:
    active: true
  EqualsOnSignatureLine:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  ExplicitCollectionElementAccessMethod:
    active: false
  ExplicitItLambdaParameter:
    active: true
  MaxLineLength:
    # Default is 120
    maxLineLength: 160
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  AbstractClassCanBeConcreteClass:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  AbstractClassCanBeInterface:
    active: false
  FunctionOnlyReturningConstant:
    active: false
  UnusedPrivateFunction:
    active: true
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 5
  UnusedParameter:
    active: true
  UnnecessaryInnerClass:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnnecessaryLet:
    active: false
  UnnecessaryParentheses:
    active: true
    allowForUnclearPrecedence: false
  RangeUntilInsteadOfRangeTo:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnusedImport:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnusedPrivateProperty:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: true
  SerialVersionUIDInSerializableClass:
    active: false
  ProtectedMemberInFinalClass:
    active: true
  UseCheckOrError:
    active: true
  OptionalUnit:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  RedundantExplicitType:
    active: false
  TrailingWhitespace:
    active: true
  TrimMultilineRawString:
    active: true
    trimmingMethods:
      - 'trimIndent'
      - 'trimMargin'
  UnderscoresInNumericLiterals:
    active: true
    acceptableLength: 4
    allowNonStandardGrouping: false
  UnnecessaryBackticks:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnnecessaryBracesAroundTrailingLambda:
    active: false
  UseDataClass:
    active: true
    allowVars: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UseEmptyCounterpart:
    active: false
  UseIfEmptyOrIfBlank:
    active: true
  UseLet:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UseSumOfInsteadOfFlatMapSize:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnusedVariable:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  VarCouldBeVal:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnnecessaryApply:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UseOrEmpty:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  ObjectLiteralToLambda:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  ForbiddenVoid:
    active: false

coroutines:
  GlobalCoroutineUsage:
    # Keep false for now.
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  SuspendFunSwallowedCancellation:
    active: false
  SuspendFunWithCoroutineScopeReceiver:
    active: true
    excludes: [ '**/test/**', '**/androidTest/**' ]
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  RedundantSuspendModifier:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  SuspendFunWithFlowReturnType:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  InjectDispatcher:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    active: false
  EmptySecondaryConstructor:
    active: true

potential-bugs:
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  ImplicitDefaultLocale:
    active: false
  # Disabled: it reports generic casts like `node as N`.
  CastNullableToNonNullableType:
    active: false
  CastToNullableType:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  Deprecation:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  DontDowncastCollectionTypes:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  ElseCaseInsteadOfExhaustiveWhen:
    active: false
  ExitOutsideMain:
    active: true
  # Disabled: we use expression bodies returning Unit a lot, e.g. `fun FooPreview() = ElementPreview { ... }`.
  ImplicitUnitReturnType:
    active: false
    allowExplicitReturnType: false
  MissingPackageDeclaration:
    active: true
    excludes: [ '**/*.kts' ]
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  NullCheckOnMutableProperty:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  NullableToStringCall:
    active: false
  # Disabled: mostly false positives, e.g. a property used in a function body before its declaration.
  PropertyUsedBeforeDeclaration:
    active: false
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnreachableCode:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  IgnoredReturnValue:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  MapGetWithNotNullAssertionOperator:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  DoubleMutabilityForCollection:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnnecessaryNotNullOperator:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnsafeCallOnNullableType:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
  TooGenericExceptionThrown:
    active: true
  InstanceOfCheckForException:
    active: true
  # Disabled: we use objects in sealed exception hierarchies on purpose.
  ObjectExtendsThrowable:
    active: false

complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  CyclomaticComplexMethod:
    active: false
  NestedBlockDepth:
    active: false
  ComplexCondition:
    active: true
  LargeClass:
    active: true
    # Do not report large test classes.
    excludes: [ '**/test/**', '**/androidTest/**' ]

naming:
  VariableNaming:
    active: true
  TopLevelPropertyNaming:
    active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: [ 'Composable' ]
  LambdaParameterNaming:
    active: true
  # Disabled: it reports names like `isAppActiveFlow: Flow<Boolean>`.
  NonBooleanPropertyPrefixedWithIs:
    active: false
  VariableMaxLength:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  NoNameShadowing:
    active: false

performance:
  SpreadOperator:
    active: false
  # Disabled: not useful for the small collections we use.
  CouldBeSequence:
    active: false
  UnnecessaryPartOfBinaryExpression:
    active: true
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  ArrayPrimitive:
    active: false

# Note: all rules for `comments` are disabled by default, but I put them here to be aware of their existence
comments:
  AbsentOrWrongFileLicense:
    active: false
  DocumentationOverPrivateFunction:
    active: false
  DocumentationOverPrivateProperty:
    active: false
  DeprecatedBlockTag:
    active: true
  EndOfSentenceFormat:
    active: true
  OutdatedDocumentation:
    active: true
    allowParamOnConstructorProperties: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

Compose:
  CompositionLocalAllowlist:
    active: true
    # You can optionally define a list of CompositionLocals that are allowed here
    allowedCompositionLocals:
      - LocalCompoundColors
      - LocalEventContentValidationState
      - LocalSnackbarDispatcher
      - LocalCameraPositionState
      - LocalMapTilerConfig
      - LocalMediaItemPresenterFactories
      - LocalTimelineItemPresenterFactories
      - LocalRoomMemberProfilesCache
      - LocalMentionSpanUpdater
      - LocalAnalyticsService
      - LocalBuildMeta
      - LocalUiTestMode
      - LocalSdkIntVersionProvider
      - LocalTimelineEventRendererConfig
      - LocalMentionDisplayNames
  CompositionLocalNaming:
    active: true
  ContentEmitterReturningValues:
    active: true
    # You can optionally add your own composables here
    # contentEmitters: MyComposable,MyOtherComposable
  ModifierComposable:
    active: true
  ModifierMissing:
    active: true
  ModifierReused:
    active: true
  ModifierWithoutDefault:
    active: true
  MultipleEmitters:
    active: true
    # You can optionally add your own composables here
    # contentEmitters: MyComposable,MyOtherComposable
  MutableParams:
    active: true
  ComposableNaming:
    active: true
    # You can optionally disable the checks in this rule for regex matches against the composable name (e.g. molecule presenters)
    # allowedComposableFunctionNames: .*Presenter,.*MoleculePresenter
  ComposableParamOrder:
    active: true
  PreviewAnnotationNaming:
    active: true
  PreviewPublic:
    active: true
    # You can optionally disable that only previews with @PreviewParameter are flagged
    previewPublicOnlyIfParams: false
  RememberMissing:
    active: true
  UnstableCollections:
    active: true
  # Disabled: its suggestion (`SideEffect`) does not take keys and runs on every recomposition.
  UnnecessaryLaunchedEffect:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  MissingReadOnlyComposable:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  UnnecessaryComposable:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  MissingNonRestartableComposable:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  VarsWithoutStateBacking:
    active: false
  # TODO Temporarily disabled since it requires type resolution, it will be enabled again in a follow-up PR (see #8137).
  ModifierShouldBeForwardedToEveryBranch:
    active: false

# Custom rules from :tests:detekt-rules. Since detekt 2, a rule only runs if it is listed in the configuration.
ElementXRules:
  RunCatchingNotAllowed:
    active: true
  ByPreferencesDataStoreNotAllowed:
    active: true
