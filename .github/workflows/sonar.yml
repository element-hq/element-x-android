name: Sonar

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    # develop is analysed once a day with the code coverage, see nightlyReports.yml
    branches: [ main ]

permissions: {}

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --warn -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  sonar:
    name: Sonar Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Skip in forks, the SONAR_TOKEN secret is not available there.
    # Also skip manual runs on develop: develop is analysed with the code coverage by nightlyReports.yml, and an analysis
    # without the coverage report would reset the coverage to 0%.
    if: >
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'element-hq/element-x-android') &&
      !(github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    # Allow all jobs on main. Just one per PR.
    concurrency:
      group: ${{ format('sonar-{0}', github.ref) }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Ensure we are building the branch and not the branch after being merged on develop
          # https://github.com/actions/checkout/issues/881
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Setup build environment
        uses: $/.github/actions/setup-build
        with:
          free-disk-space: 'true'
      - name: Build debug code and test fixtures
        run: ./gradlew assembleGplayDebug createFullJarDebugTestFixtures :app:createFullJarGplayDebugTestFixtures $CI_GRADLE_ARG_PROPERTIES
      - name: 🔊 Publish results to Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ORG_GRADLE_PROJECT_SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
        if: ${{ always() && env.SONAR_TOKEN != '' && env.ORG_GRADLE_PROJECT_SONAR_LOGIN != '' }}
        run: ./gradlew sonar $CI_GRADLE_ARG_PROPERTIES
