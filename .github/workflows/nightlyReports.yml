name: Nightly reports

on:
  workflow_dispatch:
  schedule:
    # Every nights at 5
    - cron: "0 5 * * *"

permissions: {}

# Enrich gradle.properties for CI/CD
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -Dsonar.gradle.skipCompile=true --no-configuration-cache

jobs:
  nightlyReports:
    name: Create kover report artifact and upload sonar result
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.repository == 'element-hq/element-x-android' }}
    steps:
      - name: ⏬ Checkout with LFS
        uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5
        with:
          persist-credentials: false

      - name: Setup build environment
        uses: $/.github/actions/setup-build
        with:
          free-disk-space: 'true'
      - name: ⚙️ Run unit tests, debug and release
        run: ./gradlew test $CI_GRADLE_ARG_PROPERTIES --continue

      - name: 📸 Run screenshot tests
        run: ./gradlew verifyPaparazziDebug $CI_GRADLE_ARG_PROPERTIES --continue

      - name: 📈 Generate kover report and verify coverage
        # The merged XML report is imported by Sonar, see the `sonar` block in build.gradle.kts
        run: ./gradlew :koverXmlReportMerged :app:koverXmlReportGplayDebug :app:koverHtmlReportGplayDebug :app:koverVerifyAll $CI_GRADLE_ARG_PROPERTIES --continue

      - name: ✅ Upload kover report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kover-results
          path: |
            **/build/reports/kover

      # This is the only analysis of the develop branch including the code coverage and the unit test results, so it
      # is not done by sonar.yml, which runs on each push, else the coverage would be reset to 0% on the next push.
      - name: 🔊 Publish results to Sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          ORG_GRADLE_PROJECT_SONAR_LOGIN: ${{ secrets.SONAR_TOKEN }}
        if: ${{ always() && env.SONAR_TOKEN != '' && env.ORG_GRADLE_PROJECT_SONAR_LOGIN != '' }}
        # The sources must be built before running the analysis, since `sonar.gradle.skipCompile` is set.
        run: |
          ./gradlew assembleGplayDebug createFullJarDebugTestFixtures :app:createFullJarGplayDebugTestFixtures $CI_GRADLE_ARG_PROPERTIES
          ./gradlew sonar $CI_GRADLE_ARG_PROPERTIES

  # Dependency vulnerability analysis using https://github.com/dependency-check/dependency-check-gradle
  dependency-analysis:
    name: Dependency analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: ${{ github.repository == 'element-hq/element-x-android' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup build environment
        uses: $/.github/actions/setup-build
      - name: Dependency analysis
        run: ./gradlew dependencyCheckAnalyze $CI_GRADLE_ARG_PROPERTIES
      - name: Upload dependency analysis
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-analysis
          path: build/reports/dependency-check-report.html
