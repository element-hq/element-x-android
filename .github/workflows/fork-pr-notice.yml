name: Community PR notice

on:
  # Privilege escalation necessary to comment on pull requests from forks.
  # 🚨 We must not check out or execute any code from the PR here.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - reopened

permissions: {}

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      # Required to check out the comment file (from the base branch only).
      contents: read
      # Required to comment on the pull request.
      pull-requests: write
    name: Welcome comment
    # Only display it if base repo (upstream) is different from HEAD repo (possibly a fork)
    if: github.event.pull_request.base.repo.full_name != github.event.pull_request.head.repo.full_name
    steps:
      # With pull_request_target, this checks out the base repository, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/comments/fork-pr-notice.md
          sparse-checkout-cone-mode: false
      - name: Add welcome comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body-file .github/comments/fork-pr-notice.md
