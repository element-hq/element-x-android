name: Setup build environment
description: Free disk space, clone the enterprise submodule, and set up JDK 21, Gradle and Python. The repository must be checked out first.

inputs:
  free-disk-space:
    description: Remove unused tools from the runner to free about 14 GB of disk space.
    default: 'false'
  enterprise-ssh-key:
    description: SSH private key used to clone the enterprise submodule. The submodule is not cloned if empty (for instance on PRs from forks, where secrets are not available).
    default: ''
  setup-gradle:
    description: Configure Gradle and its cache.
    default: 'true'
  gradle-cache-read-only:
    description: >
      The GitHub cache is limited to 10 GB per repository, and each job writing the cache adds several GB
      (dependencies, transforms and build cache), so older entries get evicted and jobs can restore an incomplete cache.
      To stay under the limit, only the debug build job (build.yml) and the unit tests job (tests.yml) write the cache on develop.
      All the other jobs only read it.
    default: 'true'
  python-version:
    description: Python version to set up. Python is not set up if empty.
    default: ''

runs:
  using: composite
  steps:
    - name: Free Disk Space (Ubuntu)
      if: ${{ inputs.free-disk-space == 'true' }}
      uses: endersonmenezes/free-disk-space@24d3e2af1fe79ccdde8844605337a8835e20d012 # v4.1.0
      with:
        # Keep the tool cache, it contains the JDK used by actions/setup-java. Removing it took ~45 seconds, and the JDK then
        # had to be downloaded again.
        remove_tool_cache: false
        # Keep the Android SDK and NDK, they are used by the build.
        remove_android: false
        # The swap is replaced by a bigger swapfile by the workflows that need it.
        remove_swap: false
        # Delete the recommended unused tools (https://github.com/endersonmenezes/free-disk-space#recommended-folders-to-remove),
        # plus the .NET and Haskell ones, instead of uninstalling using APT, which is slower. The folders are removed in parallel.
        remove_folders: "
          /usr/share/az* 
          /usr/local/lib/node_modules 
          /usr/local/share/chromium 
          /usr/local/share/powershell 
          /usr/local/aws-cli 
          /usr/local/aws-sam-cli 
          /opt/pipx 
          /usr/share/dotnet 
          /opt/ghc 
          /usr/local/.ghcup 
          /opt/cabal 
          /home/runner/.ghcup 
          /home/runner/.cabal"
        # Faster deletion
        rm_cmd: "rmz"
        # Specify rmz version
        rmz_version: "3.2.1"
    - name: Add SSH private keys for submodule repositories
      if: ${{ inputs.enterprise-ssh-key != '' }}
      uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
      with:
        ssh-private-key: ${{ inputs.enterprise-ssh-key }}
    - name: Clone submodules
      if: ${{ inputs.enterprise-ssh-key != '' }}
      shell: bash
      env:
        # The FOSS CI does not use the LFS files of the submodule (the Enterprise screenshots are verified by the
        # enterprise repository CI), so do not download them. This also prevents `.git/modules/<submodule>/lfs`
        # from being created and saved by nschloe/action-cached-lfs-checkout.
        GIT_LFS_SKIP_SMUDGE: 1
      run: |
        # nschloe/action-cached-lfs-checkout restores `.git/modules/<submodule>/lfs` from its cache, which leaves a
        # `.git/modules/<submodule>` folder that is not a valid git repository, and makes `git submodule update` fail.
        for module in $(git config --file .gitmodules --get-regexp path | awk '{ print $2 }'); do
          if [ -d ".git/modules/$module" ] && [ ! -f ".git/modules/$module/HEAD" ]; then
            echo "Removing invalid submodule git dir .git/modules/$module"
            rm -rf ".git/modules/$module"
          fi
        done
        git submodule update --init --recursive
    - name: Use JDK 21
      if: ${{ inputs.setup-gradle == 'true' }}
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: 'temurin' # See 'Supported distributions' for available options
        java-version: '21'
    - name: Configure gradle
      if: ${{ inputs.setup-gradle == 'true' }}
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
    - name: Retry rate-limited dependency downloads
      shell: bash
      # Maven Central answers with HTTP 429 when too many requests come from the shared IPs of the GitHub runners.
      # Gradle retries these requests, by default only 3 times with a 1s then 2s backoff, then fails the build.
      # Retry them up to 8 times instead, with a backoff doubling from 2s (about 4 minutes in total). These are CI only
      # settings: GRADLE_USER_HOME/gradle.properties is not part of the repository.
      run: |
        GRADLE_PROPERTIES="${GRADLE_USER_HOME:-$HOME/.gradle}/gradle.properties"
        mkdir -p "$(dirname "$GRADLE_PROPERTIES")"
        {
          echo "systemProp.org.gradle.internal.repository.max.tentatives=8"
          echo "systemProp.org.gradle.internal.repository.initial.backoff=2000"
        } >> "$GRADLE_PROPERTIES"
    - name: Set up Python
      if: ${{ inputs.python-version != '' }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
